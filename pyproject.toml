[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tictactoe-princ"
version = "0.1.0"
description = "Immutable Tic-Tac-Toe engine (NxN, k-in-a-row, misère) with CLI, JSON saves, AI agents, and property-based tests."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "princ" }]
dependencies = []
keywords = [
  "tic-tac-toe",
  "game",
  "cli",
  "immutable",
  "minimax",
  "monte-carlo",
  "board-game",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.7",
  "mypy>=1.11",
]

[project.scripts]
tictactoe = "tictactoe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
